name: live-server
on:
  workflow_dispatch:

# Boots a REAL Paper 1.21.x server with our plugin and drives it from the
# console. Proves the plugin loads against the real API and the full
# roast pipeline works end to end.
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - name: Download Paper 1.21.x
        run: |
          set -e
          API=https://fill.papermc.io/v3/projects/paper
          VER=$(curl -sL "$API/versions" \
            | jq -r '.versions[] | select(.version.id | startswith("1.21")) | select(.version.id | contains("-") | not) | .version.id' \
            | sort -V | tail -1)
          echo "Version: $VER"
          JSON=$(curl -sL "$API/versions/$VER/builds")
          BUILD=$(echo "$JSON" | jq -r '[.[] | select(.channel=="STABLE")] | last | .id')
          NAME=$(echo "$JSON" | jq -r '[.[] | select(.channel=="STABLE")] | last | .downloads | keys[0]')
          echo "Build: $BUILD File: $NAME"
          curl -fSL -o paper.jar "$API/versions/$VER/builds/$BUILD/downloads/$NAME"
          SIZE=$(stat -c%s paper.jar)
          echo "paper.jar bytes: $SIZE"
          [ "$SIZE" -gt 10000000 ] || (echo "download looks wrong"; exit 1)

      - name: Set up server
        run: |
          set -e
          mkdir -p live/plugins
          cp build/libs/*.jar live/plugins/
          ls live/plugins/
          cd live
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nmotd=McRoastBot CI\nmax-players=5\n' > server.properties
          # Enable canned test mode for the pipeline check.
          mkdir -p plugins/McRoastBot
          printf 'debug-canned-reply: "ci roast supreme"\n' > plugins/McRoastBot/config.yml

      - name: Boot and drive via console
        run: |
          set -e
          cd live
          # Regular file + tail pipe: no FIFO deadlock, console stays writable.
          touch cmds.txt
          tail -n +1 -F cmds.txt 2>/dev/null | java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            grep -q "Done (" server.log 2>/dev/null && break
            sleep 5
          done
          grep -q "Done (" server.log || (tail -30 server.log; exit 1)
          grep -q "McRoastBot enabled" server.log || (tail -30 server.log; exit 1)
          echo "--- plugin enabled, running console checks ---"
          echo "mroast status" >> cmds.txt
          sleep 5
          grep -q "pollinations=free" server.log
          echo "mroast aitest murder" >> cmds.txt
          sleep 10
          grep -iq "CI ROAST SUPREME" server.log
          echo "--- pipeline proven, trying live Pollinations AI (non-fatal) ---"
          echo "mroast live mention" >> cmds.txt
          sleep 60
          grep -q "McRoastBot AI failed" server.log \
            && echo "LIVE AI: request failed gracefully (see log)" \
            || echo "LIVE AI: got a response or still pending (see log)"
          echo "stop" >> cmds.txt
          sleep 20
          kill -9 "$(cat server.pid)" 2>/dev/null || true
          echo "=== relevant log lines ==="
          grep -i -E "mcroastbot|roast supreme|AI failed|ERROR" server.log | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: live/server.log
