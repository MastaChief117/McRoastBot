name: live-server
on:
  workflow_dispatch:

# Boots a REAL Paper 1.21.x server with our plugin and drives it from the
# console. Proves the plugin loads against the real API and the full
# roast pipeline works end to end.
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - name: Fail fast if the build produced no jar
        run: |
          set -e
          ls build/libs/*.jar
          echo "Build artifact present, continuing."

      - name: Probe Pollinations endpoint shapes
        run: |
          echo "--- GET /models ---"
          curl -s --max-time 40 -o /tmp/m.txt -w "%{http_code}\n" "https://text.pollinations.ai/models"; head -c 200 /tmp/m.txt; echo
          echo "--- POST /openai ---"
          curl -s --max-time 60 -o /tmp/o.txt -w "%{http_code}\n" -X POST "https://text.pollinations.ai/openai" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai","messages":[{"role":"user","content":"Reply with exactly: BEANS"}],"max_tokens":20}'; head -c 300 /tmp/o.txt; echo

      - name: Download Paper-fork server jar (proven GitHub release)
        run: |
          set -e
          TAG=$(gh api repos/LeavesMC/Leaves/releases/latest --jq '.tag_name')
          echo "Leaves release: $TAG"
          gh release download "$TAG" --repo LeavesMC/Leaves \
            --pattern "leaves-*.jar" --clobber --output paper.jar
          SIZE=$(stat -c%s paper.jar)
          echo "paper.jar bytes: $SIZE"
          [ "$SIZE" -gt 10000000 ] || (echo "download looks wrong"; exit 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up server
        run: |
          set -e
          mkdir -p live/plugins
          mv paper.jar live/paper.jar
          cp build/libs/*.jar live/plugins/
          ls live/plugins/
          cd live
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nmotd=McRoastBot CI\nmax-players=5\n' > server.properties
          # Full shipped config + canned test reply (append, never overwrite).
          mkdir -p plugins/McRoastBot
          cp ../src/main/resources/config.yml plugins/McRoastBot/config.yml
          printf '\ndebug-canned-reply: "ci roast supreme"\n' >> plugins/McRoastBot/config.yml

      - name: Boot and drive via console
        run: |
          set -e
          cd live
          # Regular file + tail pipe: no FIFO deadlock, console stays writable.
          touch cmds.txt
          tail -n +1 -F cmds.txt 2>/dev/null | java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            grep -q "Done (" server.log 2>/dev/null && break
            sleep 5
          done
          grep -q "Done (" server.log || (tail -30 server.log; exit 1)
          grep -q "McRoastBot enabled" server.log || (tail -30 server.log; exit 1)
          echo "--- plugin enabled, running console checks ---"
          echo "mroast status" >> cmds.txt
          sleep 5
          grep -q "pollinations=free" server.log
          echo "mroast aitest murder" >> cmds.txt
          sleep 10
          grep -iq "CI ROAST SUPREME" server.log
          echo "--- pipeline proven, trying live Pollinations AI (non-fatal) ---"
          echo "mroast live mention" >> cmds.txt
          sleep 60
          ROASTS=$(grep -c "<RoastBot>" server.log || true)
          if [ "$ROASTS" -gt 1 ]; then
            echo "LIVE AI: real roast received"
          else
            echo "LIVE AI: no live roast (rate-limit?) - pipeline already proven by aitest"
            grep -q "McRoastBot AI failed" server.log && echo "(failure was graceful)"
          fi
          echo "stop" >> cmds.txt
          sleep 20
          kill -9 "$(cat server.pid)" 2>/dev/null || true
          echo "=== relevant log lines ==="
          grep -i -E "mcroastbot|roast supreme|AI failed|ERROR" server.log | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: live/server.log
