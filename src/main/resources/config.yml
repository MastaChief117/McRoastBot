# McRoastBot configuration. All cooldowns in seconds unless noted.
bot:
  name: RoastBot
  chat-color: AQUA
  max-chars: 200
  # Global default model string passed to providers. Per-provider override below.
  model: gpt-4o-mini
  temperature: 0.9
  max-tokens: 120
  http-timeout-seconds: 60
  # Optional per-provider model override, e.g. { nvidia: "meta/llama-3.1-70b-instruct" }
  # Pollinations default is the fast anonymous-tier model (the "openai"
  # router is a slow reasoning model and blows chat timeouts).
  provider-models: {pollinations: openai-fast}

# Preferred provider order for FAILOVER_PREFERRED mode.
# Pollinations is free and keyless, so it leads by default.
providers-preferred-order: [pollinations, keyparty, groq, nvidia, gemini, deepseek, openai, together, openrouter, fireworks, mistral]

key-rotation: ROUND_ROBIN # ROUND_ROBIN | FAILOVER_PREFERRED
key-max-attempts: 4

thresholds:
  window-minutes: 10
  tnt-craft: 5
  boat-craft: 10
  armor-stand-craft: 12
  villager-kills: 3
  cute-mob-kills: 3

cooldowns:
  per-player-seconds: 120
  global-seconds: 45
  event-seconds: 60
  milk-brb-seconds: 90

random-observer:
  enabled: true
  interval-seconds: 180
  jitter-seconds: 120

bounty-amount: 10000

# Biomes that trigger a DIMENSION roast when entered (lowercase biome keys).
rare-biomes: [mushroom_fields, deep_dark, cherry_grove, pale_garden, the_void, soul_sand_valley]

# OP-only pipeline self-test (spec test mode). Empty = disabled.
# When set, OPs can run `!aitest [mention|craft|murder|bounty|dimension|random]`
# to push a canned reply through validation -> diary -> chat.
debug-canned-reply: ""

# Extra blocked regexes (case-insensitive) on top of built-ins. Full keys, links
# and self-harm encouragement are always blocked and can never be allow-listed.
blocked-patterns: []
