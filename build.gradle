plugins {
    id 'java'
}

group = 'com.steelquill'
version = project.property('pluginVersion')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
        content {
            includeGroup 'io.papermc.paper'
        }
    }
    // Paper-API transitives that are NOT on Maven Central.
    maven {
        name = 'mojang'
        url = 'https://libraries.minecraft.net/'
        content {
            includeGroupByRegex 'com\\.mojang.*'
        }
    }
    maven {
        name = 'spigot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        content {
            includeGroup 'net.md-5'
        }
    }
    maven {
        name = 'spigot-public'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/public/'
        content {
            includeGroup 'net.md-5'
        }
    }
    maven {
        name = 'sonatype-snapshots'
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
        content {
            includeGroup 'net.md-5'
        }
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${project.property('paperApiVersion')}"
}

// Zero runtime dependencies: only JDK (HttpClient, AES-GCM) + Paper API.
// No shadow plugin needed. Keep it that way so the jar stays tiny.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filesMatching('paper-plugin.yml') {
        expand('pluginVersion': project.version)
    }
}
